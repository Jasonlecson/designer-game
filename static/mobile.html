<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1816">
<title>平面设计师模拟器</title>
<style>
/* ============================================================
   MOBILE DESIGN TOKENS — Magazine / Card Immersive
   ============================================================ */
:root {
  --bg: #1a1816;
  --bg-card: #23211e;
  --bg-elevated: #2a2724;
  --border: rgba(255,255,255,0.06);
  --text-1: #e8e3da;
  --text-2: #9a948c;
  --text-3: #6b6560;
  --accent: #d4a853;
  --accent-glow: rgba(212,168,83,0.15);
  --success: #7b9e7d;
  --danger: #c47a6a;
  --warning: #c4a43e;
  --radius: 12px;
  --radius-lg: 20px;
  --radius-sm: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  --font-sans: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text-1);
  height:100dvh;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
  user-select:none;
  -webkit-user-select:none;
}

/* ============================================================
   SCREENS
   ============================================================ */
.screen{display:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen.active{display:flex;flex-direction:column}

/* ============================================================
   COVER
   ============================================================ */
#cover{
  align-items:center;justify-content:center;
  background:linear-gradient(180deg, #1a1816 0%, #23211e 40%, #1a1816 100%);
  padding:40px 28px;
  text-align:center;
}
.cover-ambient{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 40% at 50% 35%, rgba(212,168,83,0.06) 0%, transparent 60%);
  pointer-events:none;
}
.cover-tag{
  display:inline-block;font-size:0.7rem;font-weight:600;letter-spacing:0.14em;
  color:var(--accent);border:1px solid var(--accent);
  padding:4px 16px;border-radius:20px;margin-bottom:28px;
}
.cover-title{
  font-family:var(--font-serif);font-size:2.2rem;font-weight:700;
  line-height:1.3;color:var(--text-1);margin-bottom:10px;
}
.cover-sub{
  font-size:0.95rem;color:var(--text-2);line-height:1.7;margin-bottom:36px;
}
.cover-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 28px;border:none;border-radius:var(--radius);
  font-family:var(--font-sans);font-size:0.9rem;font-weight:600;
  cursor:pointer;transition:all 0.2s;letter-spacing:0.02em;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--accent);color:#1a1816;}
.btn-secondary{background:var(--bg-elevated);color:var(--text-1);border:1px solid var(--border);}
.btn-ghost{background:transparent;color:var(--text-2);font-size:0.8rem;}
.btn-wide{width:100%}

/* ============================================================
   CREATE (Wizard)
   ============================================================ */
#create{align-items:center;justify-content:flex-start;padding:calc(40px + var(--safe-top)) 24px;overflow-y:auto}
.create-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:28px 24px;width:100%;max-width:400px;animation:fadeUp 0.35s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.create-step-label{
  font-size:0.68rem;font-weight:600;letter-spacing:0.1em;color:var(--accent);
  margin-bottom:8px;text-transform:uppercase;
}
.create-step-title{
  font-family:var(--font-serif);font-size:1.3rem;color:var(--text-1);margin-bottom:24px;
}
.create-progress{
  display:flex;gap:4px;margin-bottom:24px;
}
.create-progress div{
  flex:1;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;transition:background 0.3s;
}
.create-progress div.done{background:var(--accent)}
.create-progress div.active{background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.field{margin-bottom:14px}
.field label{display:block;font-size:0.72rem;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input{
  width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg);color:var(--text-1);font-size:0.92rem;font-family:var(--font-sans);
  transition:border-color 0.2s;
}
.field input:focus{outline:none;border-color:var(--accent)}

.select-card{
  display:flex;align-items:flex-start;gap:12px;padding:14px;
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;
  cursor:pointer;transition:all 0.2s;background:var(--bg);
  -webkit-tap-highlight-color:transparent;
}
.select-card:active{transform:scale(0.98)}
.select-card.selected{border-color:var(--accent);background:rgba(212,168,83,0.08)}
.sc-dot{
  width:20px;height:20px;min-width:20px;border-radius:50%;
  border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all 0.2s;
}
.select-card.selected .sc-dot{border-color:var(--accent);background:var(--accent)}
.select-card.selected .sc-dot::after{content:'';width:6px;height:6px;border-radius:50%;background:#1a1816}
.sc-body{flex:1;min-width:0}
.sc-title{font-weight:600;font-size:0.88rem;color:var(--text-1)}
.sc-desc{font-size:0.74rem;color:var(--text-2);margin-top:2px;line-height:1.4}
.sc-tags{display:flex;gap:6px;margin-top:6px}
.sc-tag-good{font-size:0.64rem;padding:2px 8px;border-radius:10px;background:rgba(123,158,125,0.15);color:var(--success)}
.sc-tag-warn{font-size:0.64rem;padding:2px 8px;border-radius:10px;background:rgba(196,122,106,0.12);color:var(--danger)}
.create-nav{display:flex;gap:10px;margin-top:20px}
.create-nav .btn{flex:1}

/* ============================================================
   GAME SCREEN
   ============================================================ */
#game{overflow:hidden;background:var(--bg)}

/* Header */
.game-header{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + var(--safe-top)) 16px 10px;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  z-index:10;
}
.game-header-left{display:flex;align-items:center;gap:10px}
.game-avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#b8862d);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-serif);font-size:0.95rem;color:#1a1816;font-weight:700;
}
.game-header-info{line-height:1.2}
.game-header-name{font-size:0.82rem;font-weight:700;color:var(--text-1)}
.game-header-sub{font-size:0.64rem;color:var(--text-3)}
.game-header-right{display:flex;gap:6px}
.game-header-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--bg-card);display:flex;align-items:center;justify-content:center;
  font-size:0.9rem;cursor:pointer;color:var(--text-2);
  -webkit-tap-highlight-color:transparent;
}
.game-header-btn:active{background:var(--bg-elevated)}

/* Content area */
.game-content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px;
  -webkit-overflow-scrolling:touch;
}

/* Narrative card */
.narrative-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:24px 20px;margin-bottom:16px;
}
.narrative-meta{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
}
.narrative-turn{
  font-size:0.68rem;font-weight:700;color:var(--accent);
  background:rgba(212,168,83,0.1);padding:3px 10px;border-radius:12px;
}
.narrative-tag{
  font-size:0.64rem;padding:3px 10px;border-radius:12px;font-weight:600;
}
.narrative-text{
  font-family:var(--font-serif);
  font-size:0.92rem;line-height:1.85;color:var(--text-1);
}
.narrative-text p{margin-bottom:12px}
.narrative-text p:last-child{margin-bottom:0}
.narrative-atmo{
  margin-top:14px;font-size:0.72rem;color:var(--text-3);
  font-style:italic;padding-top:12px;border-top:1px solid var(--border);
}

/* Choices */
.choices{
  display:flex;flex-direction:column;gap:10px;margin-bottom:16px;
}
.choice-btn{
  display:flex;flex-direction:column;gap:4px;padding:14px 16px;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg-card);cursor:pointer;text-align:left;
  transition:all 0.2s;-webkit-tap-highlight-color:transparent;
}
.choice-btn:active{transform:scale(0.98);border-color:var(--accent)}
.choice-btn:disabled{opacity:0.4;pointer-events:none}
.choice-btn-main{font-weight:600;font-size:0.88rem;color:var(--text-1)}
.choice-btn-hint{font-size:0.7rem;color:var(--text-3)}
.choice-btn-effect{font-size:0.66rem;color:var(--accent);margin-top:2px}
.eff-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.eff-up{font-size:0.64rem;color:var(--success);font-weight:600;padding:1px 6px;background:rgba(123,158,125,0.12);border-radius:4px}
.eff-down{font-size:0.64rem;color:var(--danger);font-weight:600;padding:1px 6px;background:rgba(196,122,106,0.1);border-radius:4px}
.choice-btn-auto{border-style:dashed}

/* Active action sub */
.aa-sub{
  display:none;padding:12px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);margin-top:-4px;margin-bottom:12px;
}
.aa-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;
  -webkit-tap-highlight-color:transparent;
}
.aa-item:active{background:rgba(212,168,83,0.08)}
.aa-item:disabled{opacity:0.35;pointer-events:none}
.aa-desc{font-size:0.68rem;color:var(--text-3)}

/* Stamina warning */
.stamina-warn{
  background:rgba(196,122,106,0.1);color:var(--danger);
  border:1px solid rgba(196,122,106,0.2);border-radius:var(--radius);
  padding:14px 16px;text-align:center;font-weight:600;font-size:0.82rem;margin-bottom:16px;
}

/* Loading */
.loading{padding:24px;display:flex;justify-content:center}
.dots{display:flex;gap:6px}
.dots span{
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  animation:bounce 1.4s infinite ease-in-out both;
}
.dots span:nth-child(1){animation-delay:-0.32s}
.dots span:nth-child(2){animation-delay:-0.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* ============================================================
   TAB BAR
   ============================================================ */
.tabbar{
  flex-shrink:0;
  display:flex;gap:0;
  background:var(--bg-card);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-bottom);
  z-index:10;
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 0 6px;border:none;background:transparent;cursor:pointer;
  font-size:0.62rem;color:var(--text-3);font-weight:500;
  -webkit-tap-highlight-color:transparent;transition:color 0.2s;
}
.tabbar button.active{color:var(--accent)}
.tabbar button .tab-icon{font-size:1.2rem}

/* ============================================================
   TAB PAGES (NPC / Stats)
   ============================================================ */
.tab-page{display:none}
.tab-page.active{display:block}

/* NPC tab */
.npc-list{display:flex;flex-direction:column;gap:8px}
.npc-card{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.npc-card:active{background:var(--bg-elevated)}
.npc-avatar{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:1rem;color:#fff;flex-shrink:0;
}
.npc-info{flex:1;min-width:0}
.npc-name{font-weight:600;font-size:0.85rem;color:var(--text-1)}
.npc-role{font-size:0.7rem;color:var(--text-3)}
.npc-rel{font-size:0.66rem;color:var(--accent);margin-top:2px}

/* Stats tab */
.stats-grid{display:flex;flex-direction:column;gap:14px}
.stat-row{}
.stat-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.stat-name{font-size:0.78rem;color:var(--text-2)}
.stat-val{font-size:0.92rem;font-weight:700}
.stat-bar{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.stat-fill{height:100%;border-radius:3px;transition:width 0.5s ease;position:relative}
.stat-fill-xp{position:absolute;top:0;left:0;height:100%;border-radius:3px;background:rgba(255,255,255,0.2);transition:width 0.8s ease}
.stat-resources{
  margin-top:20px;padding-top:16px;border-top:1px solid var(--border);
  display:flex;gap:12px;
}
.stat-res-item{
  flex:1;padding:14px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);text-align:center;
}
.stat-res-val{font-size:1.1rem;font-weight:700}
.stat-res-label{font-size:0.64rem;color:var(--text-3);margin-top:2px}

/* Milestone */
.ms-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-top:16px;
}
.ms-title{font-size:0.76rem;font-weight:600;margin-bottom:8px;color:var(--text-1)}
.ms-deadline{font-size:0.64rem;color:var(--accent);float:right}
.ms-bar{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:8px;overflow:hidden}
.ms-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.4s}
.ms-reward{font-size:0.66rem;color:var(--text-2);margin-top:6px}

/* Top bar status indicators */
.status-bar{
  display:flex;gap:12px;margin-bottom:16px;
}
.status-item{
  flex:1;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);text-align:center;
}
.status-val{font-size:0.9rem;font-weight:700}
.status-lbl{font-size:0.6rem;color:var(--text-3);margin-top:2px}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty-icon{font-size:2.5rem;margin-bottom:12px;display:block}

/* ============================================================
   MODAL / BOTTOM SHEET
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,0.5);
  display:none;align-items:flex-end;justify-content:center;
}
.modal-overlay.active{display:flex}
.modal-sheet{
  background:var(--bg-card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  width:100%;max-height:80dvh;overflow-y:auto;padding:20px;
  animation:slideUp 0.3s ease;
  padding-bottom:calc(20px + var(--safe-bottom));
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{
  width:36px;height:4px;background:var(--border);border-radius:2px;
  margin:0 auto 16px;
}
.modal-title{font-family:var(--font-serif);font-size:1.05rem;margin-bottom:14px}
.modal-close{
  margin-top:14px;padding:12px;text-align:center;border:1px solid var(--border);
  border-radius:var(--radius);font-size:0.85rem;cursor:pointer;color:var(--text-2);
  -webkit-tap-highlight-color:transparent;
}
.modal-close:active{background:var(--bg-elevated)}

/* ============================================================
   SAVE LIST
   ============================================================ */
.save-slot{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid var(--border);gap:10px;
}
.save-slot-info{min-width:0}
.save-slot-num{font-weight:600;font-size:0.85rem}
.save-slot-meta{font-size:0.68rem;color:var(--text-3);margin-top:2px}
.save-slot-actions{display:flex;gap:6px;flex-shrink:0}
.save-slot-actions button{
  padding:6px 12px;border-radius:var(--radius-sm);font-size:0.68rem;
  border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.save-slot-actions button.btn-danger{color:var(--danger);border-color:rgba(196,122,106,0.3)}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
.notif{
  position:fixed;left:12px;right:12px;
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 16px;z-index:10000;display:flex;align-items:center;gap:10px;
  font-size:0.8rem;box-shadow:0 4px 20px rgba(0,0,0,0.4);
  animation:notifIn 0.3s ease;pointer-events:none;
}
@keyframes notifIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes notifOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}
.notif-icon{font-size:1rem}
.notif-text{font-size:0.78rem;line-height:1.4}

/* Ending overlay */
.ending-overlay{position:fixed;inset:0;z-index:11000;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center}
.ending-overlay.active{display:flex}
.ending-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:32px 24px;max-width:320px;width:90%;text-align:center}
.ending-card.he{border-top:3px solid var(--accent)}
.ending-card.be{border-top:3px solid var(--danger)}
.ending-icon-m{font-size:2rem;margin-bottom:12px;display:block}
.ending-name-m{font-family:var(--font-serif);font-size:1.1rem;font-weight:700;margin-bottom:10px}
.ending-text-m{font-size:0.78rem;color:var(--text-2);line-height:1.6;margin-bottom:20px}
.ending-btn-m{padding:10px 24px;background:var(--accent);color:#1a1816;border:none;border-radius:var(--radius);font-size:0.85rem;font-weight:600;cursor:pointer}
.ending-btn-m:active{opacity:0.8}
.news-section{padding:10px 14px;margin:8px 0;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)}
.news-title{font-size:0.68rem;font-weight:600;color:var(--accent);margin-bottom:6px}
.news-item{font-size:0.64rem;color:var(--text-3);padding:2px 0}

</style>
</head>
<body>

<!-- COVER -->
<div class="screen active" id="cover">
  <div class="cover-ambient"></div>
  <div class="cover-tag">C A R E E R  S I M</div>
  <div class="cover-title">平面设计师<br>模拟器</div>
  <div class="cover-sub">在真实的职业生涯中做出选择<br>每一次决定都在塑造你的未来</div>
  <div class="cover-btns">
    <button class="btn btn-primary btn-wide" onclick="startCreate()">✦ 开始新游戏</button>
    <button class="btn btn-secondary btn-wide" onclick="loadGame()">📂 继续游戏</button>
  </div>
</div>

<!-- CREATE -->
<div class="screen" id="create"></div>

<!-- GAME -->
<div class="screen" id="game">
  <div class="game-header">
    <div class="game-header-left">
      <div class="game-avatar" id="mh-avatar">林</div>
      <div class="game-header-info">
        <div class="game-header-name" id="mh-name">—</div>
        <div class="game-header-sub" id="mh-sub">—</div>
      </div>
    </div>
    <div class="game-header-right">
      <button class="game-header-btn" onclick="showFeedback()" title="反馈">💬</button>
      <button class="game-header-btn" onclick="showSavesSheet()" title="存档">💾</button>
    </div>
    <div style="font-size:0.62rem;color:var(--accent);text-align:center;padding:4px 0;background:rgba(212,168,83,0.06)" id="mh-trend"></div>
  </div>
  <div class="game-content" id="game-content">
    <div id="tab-story" class="tab-page active"></div>
    <div id="tab-npc" class="tab-page"></div>
    <div id="tab-stats" class="tab-page"></div>
  </div>
  <div class="tabbar">
    <button class="active" data-tab="story" onclick="switchTab('story')">
      <span class="tab-icon">📖</span> 剧情
    </button>
    <button data-tab="npc" onclick="switchTab('npc')">
      <span class="tab-icon">👥</span> 人脉
    </button>
    <button data-tab="stats" onclick="switchTab('stats')">
      <span class="tab-icon">📊</span> 属性
    </button>
  </div>
</div>

<!-- MODAL OVERLAY (shared for bottom sheets) -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()"></div>

<div class="ending-overlay" id="ending-overlay-m">
  <div class="ending-card" id="ending-card-m">
    <span class="ending-icon-m" id="ending-icon-m"></span>
    <div class="ending-name-m" id="ending-name-m"></div>
    <div class="ending-text-m" id="ending-text-m"></div>
    <button class="ending-btn-m" onclick="resolveEnding()">接受结局</button>
    <button class="btn btn-ghost" style="margin-top:8px" onclick="document.getElementById('ending-overlay-m').classList.remove('active')">继续游戏</button>
  </div>
</div>
<script src="/shared.js"></script>
<script>
// ============================================================
// SCREEN MANAGEMENT
// ============================================================
let currentScreen = 'cover';
let currentTab = 'story';
let selections = {origin:'',resources:'',goal:'',pace:''};
let createStep = 0;
let currentPlayer = {name:'林知夏',age:'24',city:'上海',custom_origin:'',specialization:''};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  currentScreen = id;
}

// ============================================================
// CREATE WIZARD
// ============================================================
function startCreate() {
  selections = {origin:'',resources:'',goal:'',pace:''};
  createStep = 0;
  currentPlayer = {name:'林知夏',age:'24',city:'上海',custom_origin:''};
  showScreen('create');
  renderCreateStep();
}

function renderCreateStep() {
  const el = document.getElementById('create');
  const labels = ['基本信息', '出身选择', '开局资源', '职业目标', '节奏偏好'];
  const titles = ['你的身份', '你从何处来', '你拥有什么', '你要去向哪里', '你的节奏'];
  let html = `<div class="create-card">`;
  html += `<div class="create-step-label">STEP ${createStep+1}/5 · ${labels[createStep]}</div>`;
  html += `<div class="create-step-title">${titles[createStep]}</div>`;
  html += `<div class="create-progress">`;
  for (let i=0;i<6;i++) {
    let cls = ''; if(i<createStep)cls='done'; if(i===createStep)cls='active';
    html += `<div class="${cls}"></div>`;
  }
  html += `</div>`;

  if (createStep === 0) {
    html += `<div class="field"><label>名字</label><input id="p-name" value="${esc(currentPlayer.name)}" placeholder="输入名字"></div>`;
    html += `<div class="field"><label>年龄</label><input id="p-age" value="${esc(currentPlayer.age)}" placeholder="24"></div>`;
    html += `<div class="field"><label>城市</label><input id="p-city" value="${esc(currentPlayer.city)}" placeholder="上海"></div>`;
    html += `<div class="create-nav"><button class="btn btn-primary btn-wide" onclick="nextStep()">下一步 →</button></div>`;
  } else if (createStep === 1) {
    ORIGINS.forEach(o => {
      const sel = selections.origin === o.id ? ' selected' : '';
      html += `<div class="select-card${sel}" onclick="selectOpt('origin','${o.id}')">
        <div class="sc-dot"></div><div class="sc-body">
        <div class="sc-title">${o.id}. ${o.title}</div>
        <div class="sc-desc">${o.desc}</div>
        <div class="sc-tags">${o.good?`<span class="sc-tag-good">✦ ${o.good}</span>`:''}${o.warn?`<span class="sc-tag-warn">△ ${o.warn}</span>`:''}</div>
      </div></div>`;
    });
    html += `<div class="field"><label>自定义描述（选G需填）</label><input id="custom-origin" placeholder="描述你的职业"></div>`;
    html += `<div class="create-nav"><button class="btn btn-secondary" onclick="createStep=0;renderCreateStep()">←</button><button class="btn btn-primary" onclick="nextStep()">下一步</button></div>`;
  } else if (createStep === 2) {
    RESOURCES.forEach(r => {
      const sel = selections.resources === r.id ? ' selected' : '';
      html += `<div class="select-card${sel}" onclick="selectOpt('resources','${r.id}')">
        <div class="sc-dot"></div><div class="sc-body"><div class="sc-title">${r.id}. ${r.title}</div><div class="sc-desc">${r.desc}</div></div></div>`;
    });
    html += `<div class="create-nav"><button class="btn btn-secondary" onclick="createStep=1;renderCreateStep()">←</button><button class="btn btn-primary" onclick="nextStep()">下一步</button></div>`;
  } else if (createStep === 3) {
    GOALS.forEach(g => {
      const sel = selections.goal === g.id ? ' selected' : '';
      html += `<div class="select-card${sel}" onclick="selectOpt('goal','${g.id}')">
        <div class="sc-dot"></div><div class="sc-body"><div class="sc-title">${g.id}. ${g.title}</div><div class="sc-desc">${g.desc}</div></div></div>`;
    });
    html += `<div class="create-nav"><button class="btn btn-secondary" onclick="createStep=2;renderCreateStep()">←</button><button class="btn btn-primary" onclick="nextStep()">下一步</button></div>`;
  } else {
    PACES.forEach(p => {
      const sel = selections.pace === p.id ? ' selected' : '';
      html += `<div class="select-card${sel}" onclick="selectOpt('pace','${p.id}')">
        <div class="sc-dot"></div><div class="sc-body"><div class="sc-title">${p.id}. ${p.title}</div><div class="sc-desc">${p.desc}</div></div></div>`;
    });
    html += `<div class="create-nav"><button class="btn btn-secondary" onclick="createStep=3;renderCreateStep()">←</button><button class="btn btn-primary" onclick="startGame()">✦ 开始</button></div>`;
  }

  // Portfolio section
  html += `<div style="margin-top:16px;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)">
    <div style="font-weight:600;font-size:0.76rem;color:var(--accent);margin-bottom:8px;cursor:pointer" onclick="loadMobilePortfolio()">🎨 作品集</div>
    <div id="m-portfolio" style="font-size:0.68rem;color:var(--text-3)">点击加载作品集</div>
  </div>`;

  // Achievements section
  html += `<div style="margin-top:12px;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)">
    <div style="font-weight:600;font-size:0.76rem;color:var(--accent);margin-bottom:8px" onclick="loadMobileAchievements()">🏅 成就</div>
    <div id="m-achievements" style="font-size:0.68rem;color:var(--text-3)">点击加载成就列表</div>
  </div>`;

  el.innerHTML = html;
}

function selectOpt(type, id) { selections[type] = id; renderCreateStep(); }

function nextStep() {
  if (createStep === 0) {
    currentPlayer.name = document.getElementById('p-name')?.value || '林知夏';
    currentPlayer.age = document.getElementById('p-age')?.value || '24';
    currentPlayer.city = document.getElementById('p-city')?.value || '上海';
  }
  if (createStep === 1) {
    const ci = document.getElementById('custom-origin');
    if (ci) currentPlayer.custom_origin = ci.value;
  }
  createStep++; renderCreateStep();
}

// ============================================================
// GAME START / LOAD / RESET
// ============================================================
async function startGame() {
  if (createStep === 1) {
    const ci = document.getElementById('custom-origin');
    if (ci) currentPlayer.custom_origin = ci.value;
  }
  showScreen('game');
  setLoading(true);
  isProcessing = true;
  try {
    const d = await API.newGame({...currentPlayer, ...selections});
    gameState = d.state;
    _prevTitle = d.state?.title?.title || '';
    isProcessing = false;
    switchTab('story');
    renderAll();
  } catch(e) {
    setLoading(false, esc(e.message));
    isProcessing = false;
  }
}

async function loadGame() {
  try {
    const d = await API.getState();
    if (!d.state) { alert('没有存档'); return; }
    gameState = d.state;
    _prevTitle = d.state?.title?.title || '';
    showScreen('game');
    switchTab('story');
    renderAll();
  } catch(e) { alert('连接失败'); }
}

async function resetGame() {
  if (!confirm('确定结束当前游戏？存档将被删除。')) return;
  try { await API.reset(); } catch(e) {}
  gameState = null;
  showScreen('cover');
}

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'story') renderStory();
  else if (tab === 'npc') renderNPCTab();
  else if (tab === 'stats') renderStatsTab();
}

// ============================================================
// RENDER ALL
// ============================================================
function renderAll() {
  if (!gameState) return;
  const p = gameState.player || {};
  document.getElementById('mh-avatar').textContent = (p.name||'林')[0];
  document.getElementById('mh-name').textContent = p.name || '—';
  document.getElementById('mh-sub').textContent = (gameState.title?.title||'') + ' · ' + (gameState.game_date||'');
  // Trend
  const trendEl = document.getElementById('mh-trend');
  if (trendEl && gameState.trend) {
    trendEl.textContent = `📐 当前趋势：${gameState.trend.name}（${gameState.trend.boost_attr}↑ / ${gameState.trend.penalty_attr}↓）`;
    trendEl.style.display = '';
  } else if (trendEl) trendEl.style.display = 'none';
  // Ending
  if (window._pendingEnding) { showEnding(window._pendingEnding); window._pendingEnding = null; }
  switchTab(currentTab);
}

// ============================================================
// STORY TAB
// ============================================================
function renderStory() {
  if (!gameState) return;
  const el = document.getElementById('tab-story');
  const log = gameState.story_log || [];
  const last = log[log.length - 1];

  if (!last) {
    el.innerHTML = '<div class="empty-state"><span class="empty-icon">📖</span>你的故事即将展开</div>';
    return;
  }

  let html = '';

  // Status bar
  const st = gameState.stamina ?? 80;
  const sav = gameState.savings ?? 3000;
  const age = getCurrentAge();
  html += `<div class="status-bar">
    <div class="status-item">
      <div class="status-val" style="color:${st>60?'var(--success)':st>20?'var(--accent)':'var(--danger)'}">${st}</div>
      <div class="status-lbl">精力</div>
    </div>
    <div class="status-item">
      <div class="status-val" style="color:var(--accent)">${sav>=10000?(sav/10000).toFixed(1)+'w':(sav/1000).toFixed(0)+'k'}</div>
      <div class="status-lbl">储蓄</div>
    </div>
    <div class="status-item"><div class="status-val">${gameState.turn_count||0}</div><div class="status-lbl">回合</div></div>
    <div class="status-item"><div class="status-val">${age}</div><div class="status-lbl">年龄</div></div>
  </div>`;

  // Narrative
  const tag = last.event_tag || '日常';
  const tc = TAG_COLORS[tag] || TAG_COLORS['日常'];
  html += `<div class="narrative-card">
    <div class="narrative-meta">
      <span class="narrative-turn">T${last.turn}</span>
      <span class="narrative-tag" style="background:${tc.bg};color:${tc.color}">${tag}</span>
    </div>
    <div class="narrative-text">${formatNarrative(last.narrative || '')}</div>
    ${last.atmosphere ? `<div class="narrative-atmo">${esc(last.atmosphere)}</div>` : ''}
  </div>`;

  // Choices
  if (st <= 0) {
    html += `<div class="stamina-warn">⚡ 精力耗尽 · 即将强制休息并扣除医疗费用</div>`;
  } else if (last.choices && last.choices.length > 0) {
    html += `<div class="choices">`;
    last.choices.forEach(ch => {
      const effects = ch.effects || [];
      const effectsHtml = effects.length ? `<div class="eff-preview">${effects.map(e=>{
        const cls = e.delta>0?'eff-up':'eff-down';
        return `<span class="${cls}">${e.delta>0?'↑':'↓'} ${e.text||e.attr||''}</span>`;
      }).join(' ')}</div>` : '';
      html += `<button class="choice-btn" data-choice="${esc(ch.id)}" ${isProcessing?'disabled':''}>
        <div class="choice-btn-main">${esc(ch.text)}</div>
        <div class="choice-btn-hint">${esc(ch.hint||'')}</div>
        ${effectsHtml}
      </button>`;
    });
    html += `<button class="choice-btn choice-btn-auto" ${isProcessing?'disabled':''} onclick="toggleAA()">
      <div class="choice-btn-main">⭐ 这个月我想做点别的...</div>
    </button>
    <div class="aa-sub" id="aa-sub">${buildAAButtons()}</div>
    </div>`;
  }

  // Past story cards
  if (log.length > 1) {
    html += '<div style="font-size:0.72rem;color:var(--text-3);margin:20px 0 8px;font-weight:600">📜 过往回合</div>';
    const past = log.slice(0, -1).reverse().slice(0, 20);
    past.forEach(entry => {
      const t = entry.event_tag || '日常';
      const tc2 = TAG_COLORS[t] || TAG_COLORS['日常'];
      html += `<div class="narrative-card" style="opacity:0.7;padding:16px 14px">
        <div class="narrative-meta" style="margin-bottom:8px">
          <span class="narrative-turn">T${entry.turn}</span>
          <span class="narrative-tag" style="background:${tc2.bg};color:${tc2.color}">${t}</span>
        </div>
        <div class="narrative-text" style="font-size:0.82rem;line-height:1.7">${formatNarrative((entry.narrative||'').substring(0,200))}</div>
      </div>`;
    });
  }

  el.innerHTML = html;
}

function toggleAA() {
  const sub = document.getElementById('aa-sub');
  sub.style.display = sub.style.display === 'block' ? 'none' : 'block';
}

function buildAAButtons() {
  let html = '<div style="font-size:0.7rem;color:var(--text-3);margin-bottom:8px;text-align:center">选择一项自主行动</div>';
  ACTIVE_ACTIONS_LIST.forEach(a => {
    const disabled = a.disabled(gameState);
    html += `<div class="aa-item" data-aa="${a.key}" ${disabled||isProcessing?'disabled':''}>
      <span>${a.name}</span><span class="aa-desc">${a.desc}</span></div>`;
  });
  return html;
}

// ============================================================
// NPC TAB
// ============================================================
function renderNPCTab() {
  if (!gameState) return;
  const el = document.getElementById('tab-npc');
  const npcs = gameState.npcs || [];
  const pending = gameState._npc_pending || {};
  if (npcs.length === 0) {
    el.innerHTML = '<div class="empty-state"><span class="empty-icon">👥</span>还没有遇到任何人</div>';
    return;
  }
  let html = '<div class="npc-list">';
  npcs.forEach((n,i) => {
    const badge = pending[n.id] ? `<div style="font-size:0.6rem;color:var(--accent);margin-top:3px">📨 ${esc(pending[n.id].substring(0,25))}</div>` : '';
    html += `<div class="npc-card" data-npc-id="${esc(n.id)}">
      <div class="npc-avatar" style="background:${AVATAR_COLORS[i%6]}">${n.name[0]}</div>
      <div class="npc-info">
        <div class="npc-name">${esc(n.name)}</div>
        <div class="npc-role">${esc(n.role)}</div>
        <div class="npc-rel">${esc(n.relation||'待展开')}</div>
        ${badge}
      </div>
      <span style="color:var(--text-3)">›</span>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

async function showNPCSheet(npcId) {
  try {
    const d = await API.getNPCs(npcId);
    const npc = d.npc;
    const options = d.options;
    let html = `<div class="modal-handle"></div>`;
    html += `<div class="modal-title">与 ${esc(npc.name)} 互动</div>`;
    html += `<div style="font-size:0.74rem;color:var(--text-2);margin-bottom:16px">${esc(npc.role)} · ${esc(npc.relation||'待展开')}</div>`;
    html += '<div style="display:flex;flex-direction:column;gap:8px">';
    options.forEach(opt => {
      const disabled = !opt.available;
      const costText = opt.stamina_cost>0?`精力-${opt.stamina_cost}`:opt.stamina_cost<0?`精力+${Math.abs(opt.stamina_cost)}`:'无消耗';
      html += `<button data-npc-act="${esc(npcId)}" data-npc-action="${esc(opt.id)}" style="padding:12px;border:1px solid ${disabled?'var(--border)':'var(--accent)'};border-radius:var(--radius);background:${disabled?'var(--bg)':'rgba(212,168,83,0.08)'};color:${disabled?'var(--text-3)':'var(--accent)'};text-align:left;cursor:${disabled?'not-allowed':'pointer'}" ${disabled?'disabled':''}>
        <div style="font-weight:600;font-size:0.82rem">${esc(opt.text)}</div>
        <div style="font-size:0.68rem;margin-top:4px;color:var(--text-2)">${esc(costText)} · ${esc(opt.effect)}</div>
      </button>`;
    });
    html += '</div>';
    html += `<div class="modal-close" onclick="closeModal()">关闭</div>`;
    openModal(html);
  } catch(e) { alert('加载失败'); }
}

async function doNPC(npcId, actionId) {
  try {
    const d = await API.doNPC(npcId, actionId);
    updateGameState(d);
    showNotification('npc', `💬 ${d.npc_name}：${d.effect}`);
    renderAll();
    closeModal();
  } catch(e) { showNotification('expense', '互动失败'); }
}

// ============================================================
// STATS TAB
// ============================================================
function renderStatsTab() {
  if (!gameState) return;
  const el = document.getElementById('tab-stats');
  const attrs = gameState.attributes || {};
  const ms = gameState.milestone;
  let html = '<div class="stats-grid">';

  const xp = gameState.attribute_xp || {};
  ATTR_NAMES.forEach(k => {
    const v = attrs[k] || 0;
    const color = attrColor(v);
    const xpBar = xp[k] ? `width:${xpProgress(xp[k]).toFixed(1)}%` : 'width:0';
    html += `<div class="stat-row">
      <div class="stat-header"><span class="stat-name">${ATTR_ICONS[k]} ${k}</span><span class="stat-val" style="color:${color}">${v}</span></div>
      <div class="stat-bar"><div class="stat-fill" style="width:${(v/20*100).toFixed(1)}%;background:${color}"><div class="stat-fill-xp" style="${xpBar}"></div></div></div>
    </div>`;
  });
  html += '</div>';

  html += `<div class="stat-resources">
    <div class="stat-res-item">
      <div class="stat-res-val" style="color:var(--accent)">${gameState.stamina??80}</div>
      <div class="stat-res-label">精力</div>
    </div>
    <div class="stat-res-item">
      <div class="stat-res-val" style="color:var(--success)">${gameState.savings??3000}</div>
      <div class="stat-res-label">储蓄 (元)</div>
    </div>
    <div class="stat-res-item">
      <div class="stat-res-val">${gameState.turn_count??0}</div>
      <div class="stat-res-label">回合</div>
    </div>
  </div>`;

  if (ms && !ms.completed) {
    const deadline = ms.deadline_turn || 0;
    const turnsLeft = Math.max(0, deadline - (gameState.turn_count||0));
    const progress = Math.min(100, Math.max(0, ms.progress||0));
    html += `<div class="ms-card">
      <div class="ms-title">${esc(ms.description||'')} <span class="ms-deadline">${turnsLeft}回合剩余</span></div>
      <div class="ms-bar"><div class="ms-fill" style="width:${progress}%"></div></div>
      ${ms.reward?`<div class="ms-reward">🎁 ${esc(ms.reward)}</div>`:''}
    </div>`;
  }

  const title = gameState.title || {};
  const company = gameState.company || {};
  html += `<div style="margin-top:20px;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);font-size:0.78rem">
    <div style="color:var(--text-2);margin-bottom:4px">🎖 ${esc(title.title||'见习设计师')}</div>
    <div style="color:var(--text-3);font-size:0.7rem">👔 ${company.name?esc(company.name)+' · '+esc(company.position||'设计师'):'暂无公司'}</div>
    <div style="color:var(--text-3);font-size:0.7rem;margin-top:2px">💰 月薪 ${getMonthlySalary()/1000}k</div>
  </div>`;

  if (gameState.trait) {
    html += `<div style="margin-top:12px;padding:12px;background:rgba(212,168,83,0.06);border:1px solid rgba(212,168,83,0.15);border-radius:var(--radius);font-size:0.74rem">
      <span style="color:var(--accent);font-weight:600">特质：${esc(gameState.trait.name)}</span>
      <div style="color:var(--text-2);margin-top:4px;font-size:0.68rem">${esc(gameState.trait.desc)}</div>
    </div>`;
  }

  // Portfolio
  html += `<div style="margin-top:16px;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)">
    <div style="font-weight:600;font-size:0.76rem;color:var(--accent);margin-bottom:8px;cursor:pointer" onclick="loadMobilePortfolio()">🎨 作品集</div>
    <div id="m-portfolio" style="font-size:0.68rem;color:var(--text-3)">点击加载作品集</div>
  </div>`;
  html += `<div style="margin-top:12px;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)">
    <div style="font-weight:600;font-size:0.76rem;color:var(--accent);margin-bottom:8px;cursor:pointer" onclick="loadMobileAchievements()">🏅 成就</div>
    <div id="m-achievements" style="font-size:0.68rem;color:var(--text-3)">点击加载成就列表</div>
  </div>`;

  el.innerHTML = html;
}

// ============================================================
// MOBILE PORTFOLIO & ACHIEVEMENTS
// ============================================================
async function loadMobilePortfolio() {
  const el = document.getElementById('m-portfolio');
  if (!el) return;
  el.innerHTML = '<div class="loading"><div class="dots"><span></span><span></span><span></span></div></div>';
  try {
    const d = await API.genPortfolio();
    const entries = d.entries || [];
    if (entries.length === 0) {
      el.innerHTML = '<div style="color:var(--text-3)">还没有完成的作品</div>';
      return;
    }
    let html = '';
    entries.forEach((e, i) => {
      html += `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="font-weight:600;font-size:0.74rem">${esc(e.name||'')}</div>
        <div style="font-size:0.62rem;color:var(--text-3)">${esc(e.time||'')} · ${esc(e.client||'')}</div>
        <div style="font-size:0.64rem;color:var(--accent)">${esc(e.role||'')} · ${esc(e.style||'')}</div>
        <div style="font-size:0.62rem;color:var(--text-3)">${esc(e.scene||'')}</div>
        <div style="font-size:0.66rem;color:var(--text-2);margin-top:2px">${esc(e.highlight||'')}</div>
      </div>`;
    });
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div style="color:var(--danger)">加载失败</div>'; }
}

async function loadMobileAchievements() {
  const el = document.getElementById('m-achievements');
  if (!el) return;
  el.innerHTML = '<div class="loading"><div class="dots"><span></span><span></span><span></span></div></div>';
  try {
    const all = await fetchAchievements();
    const unlocked = new Set(gameState.unlocked_achievements || []);
    let html = '';
    all.forEach(a => {
      const u = unlocked.has(a.id);
      html += `<div style="padding:4px 0;font-size:0.68rem;${u?'':'opacity:0.4'}">
        ${a.icon} <span style="font-weight:600">${a.name}</span>
        <span style="color:var(--text-3);font-size:0.62rem"> · ${u?'已解锁':'未解锁'}</span>
      </div>`;
    });
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div style="color:var(--danger)">加载失败</div>'; }
}

// ============================================================
// MODAL SYSTEM
// ============================================================
function openModal(html) {
  const modal = document.getElementById('modal');
  modal.innerHTML = `<div class="modal-sheet">${html}</div>`;
  modal.classList.add('active');
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

// ============================================================
// ACTIONS
// ============================================================
async function makeChoice(choiceId) {
  if (isProcessing) return;
  if (gameState && gameState.stamina <= 0) return;
  isProcessing = true;
  setLoading(true);
  try {
    const d = await API.doAction(choiceId);
    processActionResponse(d);
  } catch(e) {
    setLoading(false, esc(e.message));
  }
  isProcessing = false;
  renderAll();
}

async function doActiveAction(actionKey) {
  if (isProcessing) return;
  isProcessing = true;
  setLoading(true);
  try {
    const d = await API.activeAction(actionKey);
    processActionResponse(d);
  } catch(e) {
    setLoading(false, esc(e.message));
  }
  isProcessing = false;
  renderAll();
}

function setLoading(on, msg) {
  const el = document.getElementById('tab-story');
  if (!el) return;
  if (on) el.innerHTML = '<div class="loading"><div class="dots"><span></span><span></span><span></span></div></div>';
  else if (msg) el.innerHTML = `<div style="color:var(--danger);text-align:center;padding:20px">${msg}</div>`;
}

// ============================================================
// FEEDBACK
// ============================================================
async function showFeedback() {
  let html = `<div class="modal-handle"></div>`;
  html += `<div class="modal-title">💬 反馈</div>`;
  html += `<div style="font-size:0.74rem;color:var(--text-2);margin-bottom:12px">有什么想法、建议或 bug？</div>`;
  html += `<textarea id="fb-text" style="width:100%;height:80px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text-1);font-size:0.82rem;font-family:var(--font-sans);resize:vertical" placeholder="请输入反馈..."></textarea>`;
  html += `<button class="btn btn-primary btn-wide" style="margin-top:10px" onclick="submitFeedback()">发送反馈</button>`;
  html += `<div class="modal-close" onclick="closeModal()">取消</div>`;
  openModal(html);
}

async function submitFeedback() {
  const text = document.getElementById('fb-text')?.value?.trim();
  if (!text) { alert('请输入反馈内容'); return; }
  try {
    await API.sendFeedback(text, gameState?.turn_count || 0, gameState?.player?.name || '');
    closeModal();
    showNotification('milestone', '反馈已提交，感谢！');
  } catch(e) { alert('提交失败'); }
}

// ============================================================
// SAVES
// ============================================================
async function showSavesSheet() {
  if (!gameState) return;
  try {
    const d = await API.getSaves();
    const slots = d.slots || {};
    let html = `<div class="modal-handle"></div>`;
    html += `<div class="modal-title">💾 存档管理</div>`;
    for (let i=1;i<=5;i++) {
      const s = slots[String(i)];
      html += `<div class="save-slot">
        <div class="save-slot-info">
          <div class="save-slot-num">槽位 ${i}</div>
          ${s ? `<div class="save-slot-meta">${esc(s.name)} · ${esc(s.title)} · T${s.turn} · ${esc(s.city)}</div>` : '<div class="save-slot-meta" style="color:var(--text-3)">空</div>'}
        </div>
        <div class="save-slot-actions">
          <button onclick="doSave(${i})">保存</button>
          ${s?`<button onclick="doLoad(${i})">读取</button><button class="btn-danger" onclick="doDelete(${i})">删除</button>`:''}
        </div>
      </div>`;
    }
    html += `<div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-secondary btn-wide" onclick="importSave()">📥 导入存档</button>
      <button class="btn btn-secondary btn-wide" onclick="resetGame()">🗑 结束游戏</button>
    </div>`;
    html += `<div class="modal-close" onclick="closeModal()">关闭</div>`;
    openModal(html);
  } catch(e) { alert('加载失败'); }
}

async function doSave(slot) {
  try { await API.saveSlot(slot); showNotification('milestone','已保存'); showSavesSheet(); }
  catch(e) { alert('保存失败'); }
}
async function doLoad(slot) {
  if (!confirm(`确定读取槽位${slot}？当前进度将被覆盖。`)) return;
  try {
    const d = await API.loadSlot(slot);
    gameState = d.state;
    _prevTitle = d.state?.title?.title || '';
    closeModal();
    renderAll();
    showNotification('milestone',`已读取槽位${slot}`);
  } catch(e) { alert('读取失败'); }
}
async function doDelete(slot) {
  if (!confirm(`确定删除槽位${slot}？不可撤销。`)) return;
  try { await API.deleteSlot(slot); showSavesSheet(); }
  catch(e) { alert('删除失败'); }
}
async function importSave() {
  const input = document.createElement('input');
  input.type='file'; input.accept='.json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const state = JSON.parse(await file.text());
      if (!state.player||!state.attributes) { alert('格式无效'); return; }
      await API.importState(state);
      gameState = state;
      _prevTitle = state?.title?.title || '';
      closeModal();
      renderAll();
      showNotification('milestone','导入成功');
    } catch(err) { alert('导入失败: '+err.message); }
  };
  input.click();
}

// ============================================================
// EVENT DELEGATION
// ============================================================
document.addEventListener('click', function(e) {
  const choiceBtn = e.target.closest('.choice-btn');
  if (choiceBtn && !choiceBtn.disabled && !isProcessing) {
    if (gameState && gameState.stamina <= 0 && choiceBtn.dataset.choice !== '__action__') return;
    const id = choiceBtn.dataset.choice;
    if (id) makeChoice(id);
    return;
  }
  const aaItem = e.target.closest('.aa-item');
  if (aaItem && !aaItem.disabled && !isProcessing) {
    doActiveAction(aaItem.dataset.aa);
    return;
  }
  const npcCard = e.target.closest('.npc-card');
  if (npcCard && npcCard.dataset.npcId) {
    showNPCSheet(npcCard.dataset.npcId);
    return;
  }
  const npcActBtn = e.target.closest('[data-npc-act]');
  if (npcActBtn && !npcActBtn.disabled) {
    doNPC(npcActBtn.dataset.npcAct, npcActBtn.dataset.npcAction);
    return;
  }
});

// Init
showScreen('cover');
</script>
</body>
</html>
