      <span>${a.icon}</span> <span style="font-weight:600">${a.name}</span>
      <div style="font-size:0.65rem;color:var(--text-secondary)">${unlocked?'已解锁':'未解锁'} · ${a.desc}</div>
    </div>`;
  });
  grid.innerHTML = html;
}

// ============= I4-P1: ACTIVE ACTION HANDLER =============
async function doActiveAction(actionKey) {
  if (isProcessing) return;
  isProcessing = true;

  const choicesEl = document.getElementById('event-choices');
  if (choicesEl) {
    choicesEl.innerHTML = '<div class="loading-state" style="padding:16px"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
  }

  try {
    const r = await fetch('/api/active_action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: actionKey })
    });
    const d = await r.json();
    if (d.error) { alert(d.error); isProcessing = false; return; }

    // Full state update — now includes LLM narrative + choices
    if (d.entry) gameState.story_log.push(d.entry);
    if (d.attributes) gameState.attributes = d.attributes;
    if (d.stamina !== undefined) gameState.stamina = d.stamina;
    if (d.savings !== undefined) gameState.savings = d.savings;
    if (d.title) gameState.title = d.title;
    if (d.npcs) gameState.npcs = d.npcs;
    if (d.company) gameState.company = d.company;
    if (d.career_history) gameState.career_history = d.career_history;
    if (d.unlocked_achievements) gameState.unlocked_achievements = d.unlocked_achievements;
    if (d.milestone) gameState.milestone = d.milestone;
    if (d.trait) gameState.trait = d.trait;
    if (d.stamina_status) gameState.stamina_status = d.stamina_status;
    if (d.turn) gameState.turn_count = d.turn;

    // All event notifications (check promotion BEFORE updating _prev_title)
    if (d.new_achievements && d.new_achievements.length > 0) {
      d.new_achievements.forEach(a => showNotification('achievement', `${a.icon} ${a.name} — ${a.desc}`));
    }
    if (d.title && d.title.title !== (gameState._prev_title || '')) {
      showNotification('promotion', `晋升为${d.title.title}！`);
    }
    if (d.milestone_done) {
      showNotification('milestone', d.milestone_reward ? `目标达成！奖励：${d.milestone_reward}` : '阶段目标已过期');
    }
    if (d.economy_event) {
      const ev = d.economy_event;
      if (ev.salary > 0) {
        showNotification('expense', `月结：工资+${ev.salary}元 开销-${ev.expense}元 净${ev.net >= 0 ? '+' : ''}${ev.net}元`);
      } else {
        showNotification('expense', `月结：暂无固定收入 开销-${ev.expense}元`);
      }
    }
    if (d.crisis_event) showNotification('expense', '⚠️ ' + d.crisis_event.message);
    if (d.arc_msg) showNotification('npc', '📖 ' + d.arc_msg);
    if (d.challenge) showNotification('milestone', '🔥 ' + d.challenge.name + '：' + d.challenge.message);
    if (d.project_phase_hint) showNotification('milestone', '📋 ' + d.project_phase_hint);
    if (d.npc_event) showNotification('npc', `${d.npc_event.npc_name}：${d.npc_event.text}`);
    if (d.result) showNotification('npc', '⚡ ' + d.result);
    gameState._prev_title = (d.title && d.title.title) || gameState._prev_title;
  } catch (e) { alert('失败: ' + e.message); }
  isProcessing = false;
  renderAll();
}

// ============= I4-P2: SAVE MANAGEMENT =============
async function showSaves() {
  try {
    const r = await fetch('/api/saves');
    const d = await r.json();
    const slots = d.slots || {};
    let html = '<h3 style="font-family:var(--font-serif);margin-bottom:16px;font-size:1.1rem">📂 存档管理</h3>';
    for (let i = 1; i <= 5; i++) {
      const s = slots[String(i)];
      html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--surface-2);gap:12px">
        <div style="min-width:0">
          <span style="font-weight:600;font-size:0.85rem">槽位 ${i}</span>
          ${s ? `<div style="font-size:0.72rem;color:var(--text-secondary)">${esc(s.name)} · ${esc(s.title)} · 第${s.turn}回合 · ${esc(s.city)}</div>` : '<div style="font-size:0.72rem;color:var(--text-tertiary)">空</div>'}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button onclick="saveToSlot(${i})" style="padding:6px 12px;font-size:0.72rem;border-radius:var(--radius-sm);border:1px solid var(--surface-3);background:var(--surface-card);cursor:pointer">保存</button>
          ${s ? `<button onclick="loadSlot(${i})" style="padding:6px 12px;font-size:0.72rem;border-radius:var(--radius-sm);border:1px solid var(--surface-3);background:var(--surface-card);cursor:pointer">读取</button>
          <button onclick="deleteSlot(${i})" style="padding:6px 12px;font-size:0.72rem;border-radius:var(--radius-sm);border:1px solid var(--danger-bg);background:var(--surface-card);color:var(--danger);cursor:pointer">删除</button>` : ''}
        </div>
      </div>`;
    }
    html += `<div style="margin-top:16px;display:flex;gap:8px">
      <button onclick="importSave()" style="flex:1;padding:10px 20px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent-bg);color:var(--accent);cursor:pointer;font-size:0.85rem">📥 导入存档</button>
      <button onclick="closeSaves()" style="flex:1;padding:10px 20px;border:1px solid var(--surface-3);border-radius:var(--radius);background:var(--surface-card);cursor:pointer;font-size:0.85rem">关闭</button>
    </div>`;
    showModal(html);
  } catch (e) { alert('加载失败: ' + e.message); }
}

async function saveToSlot(slot) {
  try {
    const r = await fetch('/api/saves/save', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({slot}) });
    const d = await r.json();
    if (d.ok) { showNotification('milestone', `已保存到槽位 ${slot}`); showSaves(); }
    else alert(d.error);
  } catch (e) { alert('保存失败'); }
}

async function loadSlot(slot) {
  if (!confirm(`确定读取槽位 ${slot} 的存档？当前进度将被覆盖。`)) return;
  try {
    const r = await fetch('/api/saves/load', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({slot}) });
    const d = await r.json();
    if (d.ok) {
      gameState = d.state;
      gameState._prev_title = (d.state.title && d.state.title.title) || '';
      closeSaves();
      renderAll();
      showNotification('milestone', `已从槽位 ${slot} 读取存档`);
    } else alert(d.error);
  } catch (e) { alert('读取失败'); }
}

async function deleteSlot(slot) {
  if (!confirm(`确定删除槽位 ${slot} 的存档？此操作不可撤销。`)) return;
  try {
    await fetch('/api/saves/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({slot}) });
    showSaves();
  } catch (e) { alert('删除失败'); }
}

function importSave() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const state = JSON.parse(text);
      if (!state.player || !state.attributes) {
        alert('存档格式无效');
        return;
      }
      const r = await fetch('/api/import', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({state})
      });
      const d = await r.json();
      if (d.ok) {
        gameState = d.state;
        gameState._prev_title = (d.state.title && d.state.title.title) || '';
        closeSaves();
        renderAll();
        showNotification('milestone', '存档导入成功');
      } else {
        alert(d.error || '导入失败');
      }
    } catch (err) {
      alert('导入失败: ' + err.message);
    }
  };
  input.click();
}

function showModal(html) {
  let modal = document.getElementById('saves-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'saves-modal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3)';
    modal.onclick = function(e) { if (e.target === modal) modal.remove(); };
    document.body.appendChild(modal);
  }
  modal.innerHTML = `<div style="background:var(--surface-card);border-radius:var(--radius-lg);padding:24px;max-width:400px;width:92%;max-height:70vh;max-height:70dvh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.12);-webkit-overflow-scrolling:touch">${html}</div>`;
  modal.style.display = 'flex';
}

function closeSaves() {
  const modal = document.getElementById('saves-modal');
  if (modal) modal.remove();
}

// ============= TIME / CALENDAR =============
function formatGameDate(turnCount) {
  if (!gameState || !gameState.start_date) return `第 ${turnCount} 回合`;
  try {
    const start = new Date(gameState.start_date);
    const d = new Date(start.getTime() + turnCount * 7 * 86400000);
    const seasons = { 3:'🌸春',4:'🌸春',5:'🌸春', 6:'☀️夏',7:'☀️夏',8:'☀️夏', 9:'🍂秋',10:'🍂秋',11:'🍂秋', 0:'❄️冬',1:'❄️冬',2:'❄️冬' };
    const season = seasons[d.getMonth()] || '';
    return `${d.getFullYear()}年${d.getMonth()+1}月 · 第${turnCount}周 ${season}`;
  } catch(e) { return `第 ${turnCount} 回合`; }
}

function showEnding(ending) {
  const overlay = document.getElementById('ending-overlay');
  const card = document.getElementById('ending-card');
  const isHe = ending.type?.startsWith('he');

  card.className = 'ending-card ' + (isHe ? 'he' : 'be');
  document.getElementById('ending-icon').textContent = isHe ? '🌟' : '💀';
  document.getElementById('ending-title').textContent = isHe ? '顶级突破' : '生涯终结';
  document.getElementById('ending-text').textContent = ending.text || '';

  overlay.classList.add('active');
}

// ============= CONFIG =============
async function showConfig() {
  document.getElementById('config-modal').classList.add('active');
  try {
    const r = await fetch('/api/config');
    const d = await r.json();
    document.getElementById('cfg-base').value = d.api_base || '';
    document.getElementById('cfg-key').value = d.has_key ? '***' : '';
    document.getElementById('cfg-model').value = d.model || 'gpt-4o-mini';
  } catch (e) {}
}
function hideConfig() { document.getElementById('config-modal').classList.remove('active'); }
async function saveConfig() {
  const data = {
    api_base: document.getElementById('cfg-base').value,
    api_key: document.getElementById('cfg-key').value,
    model: document.getElementById('cfg-model').value
  };
  try {
    const r = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const j = await r.json();
    alert(j.ok ? '已保存' : '保存失败');
    hideConfig();
  } catch (e) { alert('保存失败'); }
}

// ============= HELPERS =============
function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function formatNarrative(text) {
  if (!text) return '';
  return text.split('\n').filter(l => l.trim()).map(l => `<p>${esc(l)}</p>`).join('');
}

// Init
switchScreen('cover-screen');

// Sidebar resize — desktop only
(function() {
  const sidebar = document.getElementById('sidebar');
  const resizer = document.getElementById('sidebar-resizer');
  if (!sidebar || !resizer) return;
  let dragging = false, startX, startW;

  // Restore saved width
  const savedW = localStorage.getItem('sidebar-w');
  if (savedW && window.innerWidth > 860) {
    sidebar.style.width = savedW + 'px';
    document.documentElement.style.setProperty('--sidebar-w', savedW + 'px');
  }

  function onDown(e) {
    if (window.innerWidth <= 860) return; // no resize on mobile
    dragging = true;
    resizer.classList.add('dragging');
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startW = parseInt(getComputedStyle(sidebar).width, 10);
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
  }

  function onMove(e) {
    if (!dragging) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const w = Math.max(200, Math.min(420, startW + (x - startX)));
    sidebar.style.width = w + 'px';
    document.documentElement.style.setProperty('--sidebar-w', w + 'px');
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    const w = parseInt(getComputedStyle(sidebar).width, 10);
    localStorage.setItem('sidebar-w', w);
  }

  resizer.addEventListener('mousedown', onDown);
  resizer.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);
})();

// Global event delegation for choice buttons (always works regardless of re-renders)
document.addEventListener('click', function(e) {
  const btn = e.target.closest('#event-choices .choice-btn');
  if (btn && !btn.disabled && !isProcessing) {
    const choiceId = btn.getAttribute('data-choice');
    if (choiceId) makeChoice(choiceId);
    return;
  }
  // I4-P1: Active action buttons
  const aaBtn = e.target.closest('.aa-btn');
  if (aaBtn && !aaBtn.disabled && !isProcessing) {
    const actionKey = aaBtn.getAttribute('data-aa');
    if (actionKey) doActiveAction(actionKey);
    return;
  }
});
</script>
