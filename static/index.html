<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平面设计师模拟器 · 职业生涯版</title>
<style>
/* ============================================================
   DESIGN TOKENS — Editorial × Creative Studio
   ============================================================ */
:root {
  /* Warm neutrals — tinted with amber */
  --surface-0: #faf7f2;
  --surface-1: #f5f1ea;
  --surface-2: #ede7dd;
  --surface-3: #e3dbce;
  --surface-card: #fdfcfa;
  --surface-sidebar: #2b2722;

  /* Text */
  --text-primary: #2d2a26;
  --text-secondary: #6b6560;
  --text-tertiary: #9e9790;
  --text-sidebar: #c8c3bb;
  --text-sidebar-dim: #8a847d;

  /* Accent — warm amber / gold */
  --accent: #b8862d;
  --accent-light: #d4a853;
  --accent-bg: #fdf5e6;
  --accent-glow: rgba(184, 134, 45, 0.12);

  /* Semantic */
  --success: #6b8f71;
  --success-bg: #edf5ee;
  --warning: #c4a43e;
  --warning-bg: #fdf8e8;
  --danger: #b55b4a;
  --danger-bg: #fdf0ed;

  /* Layout */
  --sidebar-w: 260px;
  --radius-sm: 4px;
  --radius: 8px;
  --radius-lg: 14px;

  /* Typography */
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', 'STSong', serif;
  --font-sans: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'PingFang SC', monospace;

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-sans);
  background: var(--surface-0);
  color: var(--text-primary);
  line-height: 1.6;
  height: 100vh;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* ============================================================
   SCREENS
   ============================================================ */
.screen { display: none; }
.screen.active { display: flex; }

/* ============================================================
   COVER SCREEN
   ============================================================ */
#cover-screen {
  height: 100vh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
#cover-screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 30%, rgba(212,168,83,0.08) 0%, transparent 50%),
    radial-gradient(ellipse 60% 80% at 80% 60%, rgba(184,134,45,0.06) 0%, transparent 50%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(107,143,113,0.04) 0%, transparent 50%);
  z-index: 0;
}
.cover-content {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 520px;
  padding: 40px;
}
.cover-tag {
  display: inline-block;
  font-family: var(--font-sans);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent-light);
  padding: 4px 16px;
  border-radius: 20px;
  margin-bottom: 28px;
}
.cover-title {
  font-family: var(--font-serif);
  font-size: clamp(2.2rem, 5vw, 3.2rem);
  font-weight: 700;
  line-height: 1.25;
  color: var(--text-primary);
  letter-spacing: 0.02em;
  margin-bottom: 12px;
}
.cover-subtitle {
  font-family: var(--font-serif);
  font-size: 1.05rem;
  color: var(--text-secondary);
  font-weight: 400;
  line-height: 1.7;
  margin-bottom: 40px;
}
.cover-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.cover-footer {
  position: absolute;
  bottom: 24px;
  z-index: 1;
  font-size: 0.72rem;
  color: var(--text-tertiary);
  letter-spacing: 0.04em;
}

/* ============================================================
   CREATE SCREEN
   ============================================================ */
#create-screen {
  height: 100vh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--surface-card);
}
.create-container { width: 100%; max-width: 560px; padding: 40px 24px; }
.create-header { text-align: center; margin-bottom: 36px; }
.create-header h2 {
  font-family: var(--font-serif);
  font-size: 1.6rem;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.create-header p { font-size: 0.82rem; color: var(--text-secondary); }
.create-progress {
  display: flex;
  gap: 4px;
  margin-bottom: 36px;
}
.create-progress .dot {
  flex: 1;
  height: 3px;
  background: var(--surface-2);
  border-radius: 2px;
  transition: background 0.4s var(--ease-out);
}
.create-progress .dot.done { background: var(--accent-light); }
.create-progress .dot.active { background: var(--accent); }

.create-step { display: none; animation: fadeSlideIn 0.4s var(--ease-out); }
.create-step.active { display: block; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.field input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--surface-3);
  border-radius: var(--radius);
  font-family: var(--font-sans);
  font-size: 0.95rem;
  background: var(--surface-0);
  color: var(--text-primary);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.field input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.select-card {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px;
  border: 1px solid var(--surface-3);
  border-radius: var(--radius);
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--surface-card);
}
.select-card:hover { border-color: var(--accent-light); background: var(--accent-bg); }
.select-card.selected { border-color: var(--accent); background: var(--accent-bg); }
.select-card .sc-radio {
  width: 20px; height: 20px; min-width: 20px;
  border-radius: 50%;
  border: 2px solid var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  margin-top: 2px;
  transition: all 0.2s;
}
.select-card.selected .sc-radio {
  border-color: var(--accent);
  background: var(--accent);
}
.select-card.selected .sc-radio::after {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #fff;
}
.select-card .sc-body { flex: 1; }
.select-card .sc-title { font-weight: 600; font-size: 0.92rem; color: var(--text-primary); }
.select-card .sc-desc { font-size: 0.8rem; color: var(--text-secondary); margin-top: 3px; }
.select-card .sc-tags {
  display: flex; gap: 6px; margin-top: 8px;
}
.select-card .sc-tags span {
  font-size: 0.68rem;
  padding: 2px 10px;
  border-radius: 10px;
  font-weight: 500;
}
.sc-tag-good { background: var(--success-bg); color: var(--success); }
.sc-tag-warn { background: var(--warning-bg); color: var(--warning); }
.sc-tag-info { background: var(--accent-bg); color: var(--accent); }

.create-nav { display: flex; gap: 10px; margin-top: 24px; }
.create-nav .btn-back { margin-right: auto; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 24px;
  border: none; border-radius: var(--radius);
  font-family: var(--font-sans); font-size: 0.88rem; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: #a07428; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary {
  background: var(--surface-card);
  color: var(--text-primary);
  border: 1px solid var(--surface-3);
}
.btn-secondary:hover { border-color: var(--accent-light); background: var(--accent-bg); }
.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  padding: 8px 16px;
}
.btn-ghost:hover { color: var(--text-primary); background: var(--surface-1); }
.btn-sm { padding: 8px 16px; font-size: 0.8rem; }
.btn-icon { gap: 6px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

/* ============================================================
   GAME SCREEN
   ============================================================ */
#game-screen {
  height: 100vh;
  display: none;
}
#game-screen.active { display: flex; }

/* Sidebar */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface-sidebar);
  display: flex; flex-direction: column;
  overflow-y: auto;
  border-right: 1px solid rgba(255,255,255,0.04);
}

.side-section { padding: 20px; }
.side-section + .side-section { border-top: 1px solid rgba(255,255,255,0.05); }

/* Player card */
.player-card { text-align: center; padding: 24px 20px; }
.player-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-size: 1.6rem;
  color: #fff;
  margin-bottom: 12px;
  box-shadow: 0 4px 16px rgba(184,134,45,0.25);
}
.player-name { font-size: 1.05rem; font-weight: 700; color: #e8e3da; }
.player-origin { font-size: 0.75rem; color: var(--text-sidebar-dim); margin-top: 2px; }
.player-meta {
  display: flex; justify-content: center; gap: 16px;
  margin-top: 12px;
}
.player-meta-item { text-align: center; }
.player-meta-val { font-size: 0.9rem; font-weight: 700; color: var(--accent-light); }
.player-meta-label { font-size: 0.65rem; color: var(--text-sidebar-dim); }

/* Attributes */
.attr-list { display: flex; flex-direction: column; gap: 10px; }
.attr-row { }
.attr-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
.attr-name { font-size: 0.75rem; color: var(--text-sidebar); }
.attr-value { font-size: 0.85rem; font-weight: 700; }
.attr-value.high { color: var(--success); }
.attr-value.mid { color: var(--accent-light); }
.attr-value.low { color: #d4846a; }
.attr-bar {
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.attr-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s var(--ease-out);
}
.attr-fill.high { background: var(--success); }
.attr-fill.mid { background: var(--accent-light); }
.attr-fill.low { background: #d4846a; }

/* Portfolio in sidebar */
.portfolio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.portfolio-thumb {
  aspect-ratio: 1;
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem;
  color: var(--text-sidebar-dim);
}
.portfolio-thumb.has-work {
  background: linear-gradient(135deg, rgba(212,168,83,0.2), rgba(184,134,45,0.1));
  color: var(--accent-light);
  font-size: 1rem;
}

/* NPC list */
.npc-list { display: flex; flex-direction: column; gap: 8px; }
.npc-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0;
}
.npc-dot {
  width: 28px; height: 28px; min-width: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; color: #fff; font-weight: 600;
}
.npc-info { flex: 1; min-width: 0; }
.npc-name { font-size: 0.78rem; color: var(--text-sidebar); font-weight: 500; }
.npc-role { font-size: 0.68rem; color: var(--text-sidebar-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Sidebar bottom */
.side-footer { margin-top: auto; padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.05); }
.side-footer .btn-ghost {
  width: 100%;
  justify-content: center;
  color: var(--text-sidebar-dim);
  font-size: 0.75rem;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  padding: 8px;
}

/* ============================================================
   MAIN AREA
   ============================================================ */
#main-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface-0);
}

/* Top bar with tab nav */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: var(--surface-card);
  border-bottom: 1px solid var(--surface-2);
}
.topbar-left {
  display: flex; align-items: center; gap: 0;
}
.topbar-location {
  font-family: var(--font-serif);
  font-size: 0.85rem;
  color: var(--text-secondary);
  font-style: italic;
  margin-right: 16px;
}
.topbar-turn {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent);
  padding: 3px 12px;
  background: var(--accent-bg);
  border-radius: 12px;
  margin-right: 16px;
}
.topbar-event-tag {
  font-size: 0.72rem;
  padding: 3px 12px;
  border-radius: 12px;
  font-weight: 600;
  margin-right: 16px;
}
/* Tab nav */
.topbar-tabs {
  display: flex; gap: 0;
  margin-left: 8px;
}
.tab-btn {
  padding: 14px 20px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  border: none;
  background: none;
  font-family: var(--font-sans);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; }

/* Content scroll */
#content-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px 28px;
}

/* ============================================================
   DASHBOARD LAYOUT (multi-panel)
   ============================================================ */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto;
  gap: 20px;
}
.dashboard-grid .panel-event {
  grid-column: 1 / -1;
}
.panel {
  background: var(--surface-card);
  border: 1px solid var(--surface-2);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 20px;
  border-bottom: 1px solid var(--surface-2);
  background: var(--surface-1);
}
.panel-title {
  font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);
  display: flex; align-items: center; gap: 8px;
}
.panel-badge {
  font-size: 0.65rem; padding: 2px 10px; border-radius: 10px; font-weight: 600;
}
.panel-body { padding: 18px 20px; }

/* Event panel (top, full width) */
.event-narrative {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  line-height: 2;
  color: var(--text-primary);
}
.event-narrative p + p { margin-top: 1em; }
.event-choices {
  display: flex; gap: 10px; flex-wrap: wrap;
  padding: 16px 20px 20px;
  border-top: 1px solid var(--surface-2);
}

/* Choice buttons */
.choice-btn {
  flex: 1;
  min-width: 150px;
  padding: 16px 18px;
  background: var(--surface-0);
  border: 1px solid var(--surface-3);
  border-radius: var(--radius);
  cursor: pointer;
  text-align: left;
  font-family: var(--font-sans);
  transition: all 0.2s var(--ease-out);
}
.choice-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-bg);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(184,134,45,0.08);
}
.choice-btn .ch-letter {
  display: inline-block;
  font-size: 0.65rem; font-weight: 700;
  color: var(--accent); background: var(--accent-bg);
  width: 20px; height: 20px; line-height: 20px;
  text-align: center; border-radius: 4px;
  margin-bottom: 6px; border: 1px solid var(--accent-light);
}
.choice-btn .ch-text { font-size: 0.88rem; font-weight: 600; color: var(--text-primary); }
.choice-btn .ch-hint { font-size: 0.72rem; color: var(--text-secondary); margin-top: 5px; }
.choice-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Career log panel (bottom-left) */
.log-list { max-height: 300px; overflow-y: auto; }
.log-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--surface-2);
  cursor: pointer;
  transition: background 0.15s;
}
.log-item:last-child { border-bottom: none; }
.log-item:hover { background: var(--surface-1); margin: 0 -12px; padding: 10px 12px; border-radius: var(--radius-sm); }
.log-item-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 3px;
}
.log-turn-num {
  font-family: var(--font-mono); font-size: 0.68rem;
  color: var(--accent); background: var(--accent-bg);
  padding: 1px 7px; border-radius: 3px; white-space: nowrap;
}
.log-turn-action {
  font-size: 0.78rem; font-weight: 500; color: var(--text-primary);
}
.log-turn-date {
  font-size: 0.68rem; color: var(--text-tertiary); margin-left: auto;
}
.log-item-preview {
  font-size: 0.75rem; color: var(--text-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.log-item-tag {
  display: inline-block;
  font-size: 0.62rem; padding: 1px 8px; border-radius: 8px;
  margin-left: 6px; font-weight: 600;
}

/* NPC grid panel (bottom-right) */
.npc-panel-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  max-height: 300px; overflow-y: auto;
}
.npc-panel-card {
  padding: 12px;
  border: 1px solid var(--surface-2);
  border-radius: var(--radius);
  transition: all 0.15s;
  text-align: center;
}
.npc-panel-card:hover { border-color: var(--accent-light); background: var(--accent-bg); }
.npc-panel-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.85rem; color: #fff; font-weight: 600; margin-bottom: 8px;
}
.npc-panel-name { font-size: 0.82rem; font-weight: 600; color: var(--text-primary); }
.npc-panel-role { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }
.npc-panel-rel { font-size: 0.65rem; color: var(--accent); margin-top: 4px; }

/* ============================================================
   CAREER TIMELINE (for dedicated log view)
   ============================================================ */
.timeline { position: relative; padding-left: 32px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 11px; top: 8px; bottom: 8px;
  width: 1px; background: var(--surface-3);
}
.timeline-node { position: relative; margin-bottom: 28px; }
.timeline-node:last-child { margin-bottom: 0; }
.timeline-dot {
  position: absolute; left: -27px; top: 6px;
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid var(--surface-3); background: var(--surface-card);
  z-index: 1; transition: all 0.3s;
}
.timeline-node.current .timeline-dot {
  border-color: var(--accent); background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-glow);
}
.timeline-node.past .timeline-dot {
  border-color: var(--accent-light); background: var(--accent-light);
}
.timeline-card {
  background: var(--surface-card);
  border: 1px solid var(--surface-2);
  border-radius: var(--radius-lg); overflow: hidden;
}
.timeline-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; border-bottom: 1px solid var(--surface-2);
  background: var(--surface-1);
}
.timeline-turn-label {
  font-size: 0.78rem; font-weight: 600; color: var(--text-secondary);
  display: flex; align-items: center; gap: 8px;
}
.timeline-turn-label .turn-num {
  font-family: var(--font-mono); font-size: 0.7rem;
  color: var(--accent); background: var(--accent-bg);
  padding: 2px 8px; border-radius: 4px;
}
.timeline-card-atmosphere { font-size: 0.7rem; color: var(--text-tertiary); font-style: italic; }
.timeline-card-body { padding: 18px; }
.timeline-narrative {
  font-family: var(--font-serif);
  font-size: 0.92rem; line-height: 1.9; color: var(--text-primary);
}
.timeline-narrative p + p { margin-top: 1em; }

/* ============================================================
   PORTFOLIO PANEL
   ============================================================ */
.portfolio-showcase { display: flex; flex-direction: column; gap: 16px; }
.portfolio-stat {
  display: flex; align-items: center; gap: 16px;
  padding: 16px; background: var(--surface-0);
  border-radius: var(--radius); border: 1px solid var(--surface-2);
}
.portfolio-stat-num {
  font-family: var(--font-serif);
  font-size: 2.4rem; font-weight: 700; color: var(--accent);
  min-width: 60px; text-align: center;
}
.portfolio-stat-label { font-size: 0.78rem; color: var(--text-secondary); }
.portfolio-placeholder {
  text-align: center; padding: 40px; color: var(--text-tertiary);
  font-size: 0.85rem;
}

/* Mobile-only attribute panel */
.mobile-attrs { display: none; }

/* Tab content visibility */
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ============================================================
   LOADING & EMPTY STATES
   ============================================================ */
.loading-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-secondary);
}
.loading-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
.loading-dots span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent-light);
  animation: dotPulse 1.4s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

.empty-timeline {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-tertiary);
}
.empty-timeline .empty-icon {
  font-size: 3rem;
  margin-bottom: 16px;
  opacity: 0.6;
}
.empty-timeline h3 {
  font-family: var(--font-serif);
  font-size: 1.2rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

/* ============================================================
   ENDING OVERLAY
   ============================================================ */
.ending-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center; justify-content: center;
  z-index: 100;
}
.ending-overlay.active { display: flex; }
.ending-card {
  background: var(--surface-card);
  padding: 48px 40px;
  border-radius: var(--radius-lg);
  text-align: center;
  max-width: 440px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.ending-icon { font-size: 3rem; margin-bottom: 16px; }
.ending-title {
  font-family: var(--font-serif);
  font-size: 1.8rem;
  margin-bottom: 12px;
}
.ending-text { font-size: 0.92rem; color: var(--text-secondary); line-height: 1.8; margin-bottom: 28px; }
.ending-card.he .ending-title { color: var(--success); }
.ending-card.be .ending-title { color: var(--danger); }

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center; justify-content: center;
  z-index: 200;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface-card);
  padding: 32px;
  border-radius: var(--radius-lg);
  max-width: 420px; width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}
.modal h3 { font-family: var(--font-serif); font-size: 1.2rem; margin-bottom: 20px; color: var(--text-primary); }
.modal .field { margin-bottom: 12px; }
.modal .field label { font-size: 0.75rem; }
.modal .field input { padding: 10px 14px; font-size: 0.88rem; }
.modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 860px) {
  /* Use dvh for mobile viewport (accounts for browser chrome) */
  body { height: 100dvh; }
  #cover-screen, #create-screen, #game-screen { height: 100dvh; }

  /* Sidebar hidden, no menu toggle needed since config is in topbar */
  #sidebar { display: none; }
  .mobile-attrs { display: block; }

  /* Cover adjustments */
  .cover-content { padding: 24px 20px; }
  .cover-title { font-size: 1.8rem; }
  .cover-subtitle { font-size: 0.9rem; margin-bottom: 28px; }
  .cover-actions { flex-direction: column; }
  .cover-actions .btn { width: 100%; }

  /* Create adjustments */
  .create-container { padding: 24px 16px; }
  .select-card { padding: 12px 14px; }
  .create-nav { flex-wrap: wrap; }
  .create-nav .btn-back { margin-right: 0; }

  /* Topbar - wrap to two rows */
  #topbar {
    flex-wrap: wrap;
    padding: 8px 12px;
    gap: 6px;
  }
  .topbar-left {
    flex-wrap: wrap;
    gap: 6px;
    width: 100%;
  }
  .topbar-tabs {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .topbar-tabs .tab-btn {
    padding: 10px 14px;
    font-size: 0.75rem;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .topbar-event-tag { font-size: 0.68rem; padding: 2px 8px; }
  .topbar-turn { font-size: 0.7rem; }
  .topbar-actions { margin-left: auto; }

  /* Content */
  #content-scroll { padding: 12px; }

  /* Dashboard grid - single column */
  .dashboard-grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .dashboard-grid .panel-event { grid-column: 1; }

  /* Choice buttons - full width on mobile */
  .event-choices { flex-direction: column; }
  .choice-btn { min-width: 100%; }
  .choice-btn .ch-text { font-size: 0.85rem; }

  /* Log list */
  .log-list { max-height: 200px; }
  .log-item-preview { font-size: 0.72rem; }

  /* NPC cards - 2 per row max */
  .npc-panel-grid {
    grid-template-columns: 1fr 1fr;
    max-height: 200px;
  }

  /* Timeline */
  .timeline { padding-left: 24px; }
  .timeline::before { left: 7px; }
  .timeline-dot { left: -20px; width: 10px; height: 10px; }
  .timeline-card-body { padding: 12px; }
  .timeline-narrative { font-size: 0.85rem; line-height: 1.8; }
  .timeline-turn-label { font-size: 0.72rem; }

  /* Event panel */
  .panel-body { padding: 12px 14px; }
  .panel-header { padding: 10px 14px; }
  .event-narrative { font-size: 0.88rem; line-height: 1.8; }

  /* Portfolio */
  .portfolio-stat { flex-direction: column; align-items: flex-start; gap: 8px; }
  .portfolio-stat-num { font-size: 1.8rem; min-width: auto; }

  /* Modal */
  .modal { padding: 20px; }
  .ending-card { padding: 28px 20px; }

  /* Touch targets */
  .btn, .choice-btn, .tab-btn, .log-item {
    min-height: 44px;
    display: flex;
    align-items: center;
  }
}

/* Small phones */
@media (max-width: 400px) {
  .cover-title { font-size: 1.5rem; }
  .topbar-location { display: none; }
  .npc-panel-grid { grid-template-columns: 1fr; }
  .timeline-card-header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>
<body>

<!-- ============================================================
     COVER SCREEN
     ============================================================ -->
<div class="screen active" id="cover-screen">
  <div class="cover-content">
    <div class="cover-tag">Career Simulation</div>
    <h1 class="cover-title">平面设计师<br>模拟器</h1>
    <p class="cover-subtitle">
      没有输赢，只有选择。<br>
      在真实的设计行业里，体验一段完整的职业生涯。
    </p>
    <div class="cover-actions">
      <button class="btn btn-primary btn-icon" onclick="startCreate()">✦ 开始新的职业生涯</button>
      <button class="btn btn-secondary" onclick="loadGame()">继续上次存档</button>
    </div>
  </div>
  <div class="cover-footer">一段没有终点的职业生涯</div>
</div>

<!-- ============================================================
     CREATE SCREEN
     ============================================================ -->
<div class="screen" id="create-screen">
  <div class="create-container">
    <div class="create-header">
      <h2>创建你的设计师身份</h2>
      <p id="create-step-label">基本信息</p>
    </div>
    <div class="create-progress" id="create-progress">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div id="create-steps"></div>
  </div>
</div>

<!-- ============================================================
     GAME SCREEN
     ============================================================ -->
<div class="screen" id="game-screen">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="player-card">
      <div class="player-avatar" id="sb-avatar">林</div>
      <div class="player-name" id="sb-name">林知夏</div>
      <div class="player-origin" id="sb-origin">设计专业应届生</div>
      <div class="player-origin" id="sb-company" style="color:var(--accent-light);margin-top:4px;font-size:0.7rem">—</div>
      <div class="player-meta">
        <div class="player-meta-item">
          <div class="player-meta-val" id="sb-title" style="font-size:0.75rem;color:var(--accent-light)">见习设计师</div>
          <div class="player-meta-label">头衔</div>
        </div>
        <div class="player-meta-item">
          <div class="player-meta-val" id="sb-turn">1</div>
          <div class="player-meta-label">回合</div>
        </div>
        <div class="player-meta-item">
          <div class="player-meta-val" id="sb-credit">5</div>
          <div class="player-meta-label">信誉</div>
        </div>
        <div class="player-meta-item">
          <div class="player-meta-val" id="sb-portfolio">1</div>
          <div class="player-meta-label">作品</div>
        </div>
      </div>
    </div>

    <div class="side-section">
      <div style="font-size:0.72rem;font-weight:600;color:var(--text-sidebar-dim);letter-spacing:0.06em;margin-bottom:12px">能力属性</div>
      <div class="attr-list" id="sb-attrs"></div>
    </div>

    <div class="side-section">
      <div style="font-size:0.72rem;font-weight:600;color:var(--text-sidebar-dim);letter-spacing:0.06em;margin-bottom:12px">人脉网络</div>
      <div class="npc-list" id="sb-npcs"></div>
    </div>

    <div class="side-footer">
      <button class="btn-ghost" onclick="showConfig()">⚙ 配置</button>
      <button class="btn-ghost" onclick="resetGame()" style="margin-top:4px">结束游戏</button>
    </div>
  </div>

  <!-- Main -->
  <div id="main-area">
    <div id="topbar">
      <div class="topbar-left">
        <span class="topbar-location" id="tb-location">上海</span>
        <span class="topbar-turn" id="tb-turn">第 1 回合</span>
        <span class="topbar-event-tag" id="tb-tag" style="background:var(--accent-bg);color:var(--accent)">游戏开始</span>
        <div class="topbar-tabs">
          <button class="tab-btn active" onclick="switchTab('dashboard')">工作台</button>
          <button class="tab-btn" onclick="switchTab('log')">职业日志</button>
          <button class="tab-btn" onclick="switchTab('network')">人脉</button>
          <button class="tab-btn" onclick="switchTab('portfolio')">作品集</button>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="showConfig()">⚙</button>
      </div>
    </div>
    <div id="content-scroll">
      <!-- DASHBOARD TAB -->
      <div class="tab-content active" id="tab-dashboard">
        <div class="dashboard-grid">
          <div class="panel panel-event">
            <div class="panel-header">
              <span class="panel-title">📌 当前事件</span>
              <span class="event-date" id="event-date" style="font-size:0.7rem;color:var(--text-tertiary)"></span>
            </div>
            <div class="panel-body" id="event-narrative"></div>
            <div class="event-choices" id="event-choices"></div>
          </div>
          <div class="panel mobile-attrs">
            <div class="panel-header">
              <span class="panel-title">📊 能力属性</span>
            </div>
            <div class="panel-body" style="padding:12px 16px">
              <div id="mobile-attrs" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <span class="panel-title">📋 职业日志</span>
              <span class="panel-badge" style="background:var(--accent-bg);color:var(--accent)" id="log-count">0 回合</span>
            </div>
            <div class="panel-body" style="padding:8px 16px">
              <div class="log-list" id="log-list"></div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <span class="panel-title">👥 人脉动态</span>
            </div>
            <div class="panel-body" style="padding:12px 16px">
              <div class="npc-panel-grid" id="npc-panel-grid"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- LOG TAB -->
      <div class="tab-content" id="tab-log">
        <div class="timeline" id="timeline"></div>
      </div>
      <!-- NETWORK TAB -->
      <div class="tab-content" id="tab-network">
        <div class="npc-panel-grid" id="npc-full-grid" style="max-height:none"></div>
      </div>
      <!-- PORTFOLIO TAB -->
      <div class="tab-content" id="tab-portfolio">
        <div class="portfolio-showcase" id="portfolio-showcase"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     ENDING OVERLAY
     ============================================================ -->
<div class="ending-overlay" id="ending-overlay">
  <div class="ending-card" id="ending-card">
    <div class="ending-icon" id="ending-icon"></div>
    <h2 class="ending-title" id="ending-title"></h2>
    <p class="ending-text" id="ending-text"></p>
    <button class="btn btn-primary" onclick="resetGame()">重新开始</button>
    <button class="btn btn-secondary" onclick="closeEnding()" style="margin-left:8px;">回顾生涯</button>
  </div>
</div>

<!-- ============================================================
     CONFIG MODAL
     ============================================================ -->
<div class="modal-overlay" id="config-modal">
  <div class="modal">
    <h3>API 配置</h3>
    <div class="field"><label>Base URL</label><input id="cfg-base" placeholder="https://api.openai.com/v1"></div>
    <div class="field"><label>API Key</label><input id="cfg-key" type="password" placeholder="sk-..."></div>
    <div class="field"><label>模型</label><input id="cfg-model" placeholder="gpt-4o-mini"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="hideConfig()">取消</button>
      <button class="btn btn-primary" onclick="saveConfig()">保存</button>
    </div>
  </div>
</div>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->
<script>
// ============= STATE =============
let gameState = null;
let currentPlayer = { name: '', age: '24', city: '上海' };
let createStep = 0;
let selections = { origin: 'A', resources: 'A', goal: 'A', pace: 'A' };
let isProcessing = false;
let currentTab = 'dashboard';

const avatarColors = ['#b8862d','#6b8f71','#c4755e','#7b8fa1','#c4a43e','#8e6b9e'];

const ORIGINS = [
  { id:'A', title:'设计专业应届生', desc:'刚从美院毕业，作品集薄薄一册，满腔热血但未经市场检验。', good:'可塑性强', warn:'零资源' },
  { id:'B', title:'乙方设计公司执行', desc:'做了1-3年执行设计师，改稿赶deadline是日常。', good:'熟悉全流程', warn:'缺乏主导权' },
  { id:'C', title:'甲方品牌部设计师', desc:'在品牌公司内部团队工作，稳定但天花板明显。', good:'商业视角', warn:'创意空间有限' },
  { id:'D', title:'设计媒体编辑', desc:'采访设计师、写行业报道，了解全貌但不产出作品。', good:'信息和人脉', warn:'转型成本高' },
  { id:'E', title:'自由职业设计师', desc:'接散活维持生计，自由度高但不稳定。', good:'成长快', warn:'收入不稳' },
  { id:'F', title:'印刷厂/材料商', desc:'比设计师更懂落地，但名字不会出现在作品上。', good:'工艺知识', warn:'需证明创作力' },
  { id:'G', title:'自定义身份', desc:'自行设定职业与入行背景。', good:'完全自由', warn:'' },
];
const RESOURCES = [
  { id:'A', title:'零资源白手起家', desc:'没有任何人脉和推荐。' },
  { id:'B', title:'有行业引路人', desc:'有前辈愿意给一次机会。' },
  { id:'C', title:'有基础人脉网络', desc:'认识一些人，需要作品证明自己。' },
  { id:'D', title:'背负关系债', desc:'通过关系获得入行机会，但需要还。' },
];
const GOALS = [
  { id:'A', title:'成为顶级独立设计师', desc:'拥有自己的工作室和个人品牌。' },
  { id:'B', title:'做到创意总监/合伙人', desc:'晋升到决策层。' },
  { id:'C', title:'创立设计品牌/厂牌', desc:'创造属于自己的产品线。' },
  { id:'D', title:'成为行业话语权者', desc:'评委、导师、意见领袖。' },
  { id:'E', title:'活着就好', desc:'先在这个行业站稳脚跟。' },
];
const PACES = [
  { id:'A', title:'慢热型（推荐）', desc:'细节丰富，成长可感知。' },
  { id:'B', title:'标准型', desc:'节奏更快，项目迭代更多。' },
  { id:'C', title:'快进型', desc:'跳跃式推进，快速体验。' },
];
const STEP_LABELS = ['基本信息', '职业起点', '资源背景', '职业目标', '叙事节奏'];

// ============= SCREEN SWITCHING =============
function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function startCreate() {
  createStep = 0;
  selections = { origin: 'A', resources: 'A', goal: 'A', pace: 'A' };
  currentPlayer = { name: '', age: '24', city: '上海' };
  switchScreen('create-screen');
  renderCreateStep();
}
function showGame() { switchScreen('game-screen'); }

// ============= TAB SWITCHING =============
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#topbar .tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`#topbar .tab-btn[onclick="switchTab('${tab}')"]`)?.classList.add('active');
  document.querySelectorAll('#content-scroll .tab-content').forEach(c => c.classList.remove('active'));
  const el = document.getElementById('tab-' + tab);
  if (el) el.classList.add('active');
  if (gameState) renderTab(tab);
}

// ============= CREATE FLOW =============
function renderCreateStep() {
  const container = document.getElementById('create-steps');
  const label = document.getElementById('create-step-label');
  label.textContent = STEP_LABELS[createStep] || '';
  updateProgress();

  let html = '';
  if (createStep === 0) {
    html = `
      <div class="create-step active">
        <div class="field"><label>你的名字</label><input id="p-name" value="${esc(currentPlayer.name)}" placeholder="输入你的名字"></div>
        <div class="field"><label>年龄</label><input id="p-age" value="${esc(currentPlayer.age)}" placeholder="24"></div>
        <div class="field"><label>所在城市</label><input id="p-city" value="${esc(currentPlayer.city)}" placeholder="上海"></div>
        <div class="create-nav"><button class="btn btn-primary" onclick="nextCreateStep()">下一步 →</button></div>
      </div>`;
  } else if (createStep === 1) {
    html = '<div class="create-step active">';
    ORIGINS.forEach(o => {
      html += `<div class="select-card${selections.origin===o.id?' selected':''}" onclick="selectCard('origin','${o.id}')">
        <div class="sc-radio"></div>
        <div class="sc-body">
          <div class="sc-title">${o.id}. ${o.title}</div>
          <div class="sc-desc">${o.desc}</div>
          <div class="sc-tags">${o.good?`<span class="sc-tag-good">✦ ${o.good}</span>`:''}${o.warn?`<span class="sc-tag-warn">△ ${o.warn}</span>`:''}</div>
        </div></div>`;
    });
    html += `<div class="field" style="margin-top:8px"><label>自定义描述（仅选G需填）</label><input id="custom-origin" placeholder="描述你的职业"></div>`;
    html += `<div class="create-nav"><button class="btn btn-secondary btn-back" onclick="createStep=0;renderCreateStep()">← 上一步</button><button class="btn btn-primary" onclick="nextCreateStep()">下一步 →</button></div></div>`;
  } else if (createStep === 2) {
    html = '<div class="create-step active">';
    RESOURCES.forEach(r => {
      html += `<div class="select-card${selections.resources===r.id?' selected':''}" onclick="selectCard('resources','${r.id}')">
        <div class="sc-radio"></div><div class="sc-body"><div class="sc-title">${r.id}. ${r.title}</div><div class="sc-desc">${r.desc}</div></div></div>`;
    });
    html += `<div class="create-nav"><button class="btn btn-secondary btn-back" onclick="createStep=1;renderCreateStep()">← 上一步</button><button class="btn btn-primary" onclick="nextCreateStep()">下一步 →</button></div></div>`;
  } else if (createStep === 3) {
    html = '<div class="create-step active">';
    GOALS.forEach(g => {
      html += `<div class="select-card${selections.goal===g.id?' selected':''}" onclick="selectCard('goal','${g.id}')">
        <div class="sc-radio"></div><div class="sc-body"><div class="sc-title">${g.id}. ${g.title}</div><div class="sc-desc">${g.desc}</div></div></div>`;
    });
    html += `<div class="create-nav"><button class="btn btn-secondary btn-back" onclick="createStep=2;renderCreateStep()">← 上一步</button><button class="btn btn-primary" onclick="nextCreateStep()">下一步 →</button></div></div>`;
  } else {
    html = '<div class="create-step active">';
    PACES.forEach(p => {
      html += `<div class="select-card${selections.pace===p.id?' selected':''}" onclick="selectCard('pace','${p.id}')">
        <div class="sc-radio"></div><div class="sc-body"><div class="sc-title">${p.id}. ${p.title}</div><div class="sc-desc">${p.desc}</div></div></div>`;
    });
    html += `<div class="create-nav"><button class="btn btn-secondary btn-back" onclick="createStep=3;renderCreateStep()">← 上一步</button><button class="btn btn-primary" onclick="startGame()">✦ 开始职业生涯</button></div></div>`;
  }
  container.innerHTML = html;
}

function updateProgress() {
  const dots = document.querySelectorAll('#create-progress .dot');
  dots.forEach((d, i) => {
    d.classList.remove('done', 'active');
    if (i < createStep) d.classList.add('done');
    if (i === createStep) d.classList.add('active');
  });
}

function selectCard(type, id) {
  selections[type] = id;
  renderCreateStep();
}

function nextCreateStep() {
  if (createStep === 0) {
    currentPlayer.name = document.getElementById('p-name')?.value || '林知夏';
    currentPlayer.age = document.getElementById('p-age')?.value || '24';
    currentPlayer.city = document.getElementById('p-city')?.value || '上海';
  }
  if (createStep === 1) {
    const ci = document.getElementById('custom-origin');
    if (ci) currentPlayer.custom_origin = ci.value;
  }
  createStep++;
  renderCreateStep();
}

// ============= GAME START / LOAD / RESET =============
async function startGame() {
  if (createStep === 1) {
    const ci = document.getElementById('custom-origin');
    if (ci) currentPlayer.custom_origin = ci.value;
  }
  showGame();
  document.getElementById('event-narrative').innerHTML = '<div class="loading-state"><div class="loading-dots"><span></span><span></span><span></span></div><div>AI 正在生成你的设计师生涯…</div></div>';
  document.getElementById('event-choices').innerHTML = '';
  isProcessing = true;

  const data = { ...currentPlayer, ...selections };
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 120000);
    const r = await fetch('/api/new_game', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
      signal: ctrl.signal
    });
    clearTimeout(t);
    const d = await r.json();
    if (d.error) {
      document.getElementById('event-narrative').innerHTML = `<div style="color:var(--danger);text-align:center;padding:20px">${esc(d.error)}</div>`;
      isProcessing = false;
      return;
    }
    gameState = d.state;
  } catch (e) {
    document.getElementById('event-narrative').innerHTML = `<div style="color:var(--danger);text-align:center;padding:20px">${e.name === 'AbortError' ? '请求超时，请检查 API 配置' : '连接失败: ' + esc(e.message)}</div>`;
    isProcessing = false;
    return;
  }
  isProcessing = false;
  renderAll();
}

async function loadGame() {
  try {
    const r = await fetch('/api/state');
    const d = await r.json();
    if (!d.state) { alert('没有存档'); return; }
    gameState = d.state;
    showGame();
    renderAll();
  } catch (e) { alert('连接失败'); }
}

async function resetGame() {
  try { await fetch('/api/reset', { method: 'POST' }); } catch (e) {}
  gameState = null;
  switchScreen('cover-screen');
}

// ============= RENDER ALL =============
function renderAll() {
  if (!gameState) return;
  const attrs = gameState.attributes || {};
  const player = gameState.player || {};

  // Sidebar
  document.getElementById('sb-avatar').textContent = (player.name || '林')[0];
  document.getElementById('sb-name').textContent = player.name || '—';
  document.getElementById('sb-origin').textContent = player.origin || '—';
  const company = gameState.company || {};
  document.getElementById('sb-company').textContent = company.name ? `${company.name} · ${company.position || '设计师'}` : '—';
  const title = gameState.title || { title: '见习设计师', stage: '萌芽期' };
  document.getElementById('sb-title').textContent = title.title;
  document.getElementById('sb-turn').textContent = gameState.turn_count;
  document.getElementById('sb-credit').textContent = attrs['行业信用'] || 5;
  document.getElementById('sb-portfolio').textContent = attrs['作品集厚度'] || 1;

  // Topbar
  document.getElementById('tb-location').textContent = player.city || '上海';
  document.getElementById('tb-turn').textContent = `第 ${gameState.turn_count} 回合`;

  // Update topbar tag
  const log = gameState.story_log || [];
  const last = log[log.length - 1];
  const tag = last?.event_tag || '日常';
  const tagColors = { '项目推进': ['#edf5ee','var(--success)'], '行业事件': ['#e8f0fe','#7b8fa1'], '转折点': ['#fdf8e8','var(--warning)'], '倦怠预警': ['#fdf0ed','var(--danger)'], '日常': ['var(--accent-bg)','var(--accent)'] };
  const [tagBg, tagColor] = tagColors[tag] || tagColors['日常'];
  const tbTag = document.getElementById('tb-tag');
  tbTag.textContent = tag;
  tbTag.style.background = tagBg;
  tbTag.style.color = tagColor;

  // Sidebar attributes
  renderAttrs(attrs);
  // Mobile attributes
  renderMobileAttrs(attrs);
  // Sidebar NPCs
  renderSidebarNPCs(gameState.npcs || []);

  // Render current tab
  renderTab(currentTab);
}

function renderTab(tab) {
  if (tab === 'dashboard') {
    renderDashboard();
    renderLogList();
    renderNPCPanel();
  } else if (tab === 'log') {
    renderTimeline();
  } else if (tab === 'network') {
    renderNPCFull();
  } else if (tab === 'portfolio') {
    renderPortfolio();
  }
}

// ============= SIDEBAR RENDERERS =============

// ============= DASHBOARD PANELS =============
function renderDashboard() {
  const log = gameState.story_log || [];
  const last = log[log.length - 1];

  // Event narrative
  document.getElementById('event-date').textContent = last ? `回合 ${gameState.turn_count}` : '';
  const narrativeEl = document.getElementById('event-narrative');
  if (last?.narrative) {
    narrativeEl.innerHTML = `<div class="event-narrative">${formatNarrative(last.narrative)}</div>`;
  } else {
    narrativeEl.innerHTML = '<div class="loading-state">等待 AI 生成…</div>';
  }

  // Choices
  const choicesEl = document.getElementById('event-choices');
  if (last?.choices && last.choices.length > 0) {
    let chHtml = '';
    last.choices.forEach(ch => {
      chHtml += `<button class="choice-btn" data-choice="${esc(ch.id)}" ${isProcessing?'disabled':''}>

        <div class="ch-hint">${esc(ch.hint||'')}</div>
      </button>`;
    });

    // Bind click via delegation
    choicesEl.onclick = function(e) {
      const btn = e.target.closest('.choice-btn');

    choicesEl.innerHTML = '';

// ============= ACTION =============
async function makeChoice(choiceId) {
  if (isProcessing) return;
  isProcessing = true;

  const choicesEl = document.getElementById('event-choices');
  if (choicesEl) {
    choicesEl.innerHTML = '<div class="loading-state" style="padding:16px"><div class="loading-dots"><span></span><span></span><span></span></div><div style="font-size:0.8rem">AI 生成中…</div></div>';
  }

  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 120000);
    const r = await fetch('/api/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ choice_id: choiceId }),
      signal: ctrl.signal
    });
    clearTimeout(t);
    const d = await r.json();
    if (d.error) {
      if (choicesEl) choicesEl.innerHTML = `<div style="color:var(--danger);padding:8px">${esc(d.error)}</div>`;
      isProcessing = false;
      return;
    }
    if (d.entry) gameState.story_log.push(d.entry);
    if (d.attributes) gameState.attributes = d.attributes;
    if (d.title) gameState.title = d.title;
    if (d.new_achievements && d.new_achievements.length > 0) {
      gameState.new_achievements = d.new_achievements;
    }
    if (d.turn) gameState.turn_count = d.turn;
  } catch (e) {
    if (choicesEl) choicesEl.innerHTML = `<div style="color:var(--danger);padding:8px">${e.name === 'AbortError' ? '超时' : '失败: ' + esc(e.message)}</div>`;
  }
  isProcessing = false;
  renderAll();
}

async function saveConfig() {
  const data = {
    api_base: document.getElementById('cfg-base').value,
    api_key: document.getElementById('cfg-key').value,
    model: document.getElementById('cfg-model').value
  };
  try {
    const r = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const j = await r.json();
    alert(j.ok ? '已保存' : '保存失败');
    hideConfig();
  } catch (e) { alert('保存失败'); }
}

// ============= HELPERS =============
function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function formatNarrative(text) {
  if (!text) return '';
  return text.split('\n').filter(l => l.trim()).map(l => `<p>${esc(l)}</p>`).join('');
}

// Init
switchScreen('cover-screen');
